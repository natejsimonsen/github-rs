[package]
name = "github-prs"
version = "0.1.0"
edition = "2024"
description = "A fast desktop app for GitHub pull requests"
license = "MIT"
repository = "https://github.com/natejsimonsen/github-rs"

[dependencies]
# UI: egui draws the whole interface on the GPU (Metal on macOS, DX12/Vulkan on Windows/Linux).
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Syntax highlighting: tree-sitter grammars for ~110 languages, compiled in.
arborium = { version = "2.18", features = ["all-languages"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Networking and data.
ureq = { version = "3", features = ["json", "platform-verifier"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
dirs = "6"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
webbrowser = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize dependencies even in debug builds. egui is ~50x slower unoptimized,
# which makes `cargo run` feel broken. Our own code stays quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
# Offscreen screenshots for UI reviews (see src/snapshot.rs). Not in normal builds.
snapshot = ["dep:egui_kittest"]
